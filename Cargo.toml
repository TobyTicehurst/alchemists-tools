[workspace]
resolver = "2"
members = ["core", "calculator", "cli", "gui", "installer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alchemists-core = { path = "core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
repak = { git = "https://github.com/trumank/repak.git", features = ["oodle"] }
oodle_loader = { git = "https://github.com/trumank/repak.git" }
retoc = { git = "https://github.com/trumank/retoc.git" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
