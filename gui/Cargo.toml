[package]
name = "alchemists-gui"
description = "Desktop interface for the Alchemy Factory tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alchemists-core.workspace = true
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# the symbols the window uses (⚠, ✔, ✖) are in the emoji fonts
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
